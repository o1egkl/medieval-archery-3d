name: Build Android (Free & Paid) + Web Demo

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*.*.*' ]
  workflow_dispatch:
    inputs:
      build_release:
        description: 'Build signed Release AABs (requires GitHub Secrets)'
        required: false
        default: false
        type: boolean

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-debug-apk:
    name: Debug APK (Free & Paid)
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare Godot Android config & debug keystore
        run: |
          export HOME=/root
          mkdir -p builds
          if [ ! -f /root/debug.keystore ]; then
            keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android               -keystore /root/debug.keystore -storepass android               -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          fi
          sed -i 's|keystore/debug=""|keystore/debug="/root/debug.keystore"|g' export_presets.cfg

      - name: Pre-heat project (.godot import cache)
        run: |
          mkdir -p android/build
          unzip -q -o /root/.local/share/godot/export_templates/4.3.stable/android_source.zip -d android/build
          HOME=/root godot --headless --import --quit || true

      - name: Export Android Free Debug APK
        run: HOME=/root godot --headless --verbose --export-debug "Android Free Debug" builds/medieval_archery_free_debug.apk

      - name: Export Android Paid Debug APK
        run: HOME=/root godot --headless --verbose --export-debug "Android Paid Debug" builds/medieval_archery_paid_debug.apk

      - name: Upload Debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apks
          path: |
            builds/medieval_archery_free_debug.apk
            builds/medieval_archery_paid_debug.apk
          retention-days: 14

  build-web:
    name: Build Web Demo (HTML5)
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Pre-heat project (.godot import cache)
        run: |
          mkdir -p builds/web
          HOME=/root godot --headless --import --quit || true

      - name: Export Web (single-threaded for GitHub Pages)
        run: HOME=/root godot --headless --verbose --export-release "Web" builds/web/index.html

      - name: Upload Web build artifact for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: builds/web

  deploy-pages:
    name: Deploy Web Demo to GitHub Pages
    needs: build-web
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  build-windows:
    name: Windows Standalone (.exe)
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Pre-heat project (.godot import cache)
        run: |
          mkdir -p builds/windows
          HOME=/root godot --headless --import --quit || true

      - name: Export Windows Standalone EXE
        run: HOME=/root godot --headless --verbose --export-release "Windows Desktop" builds/windows/MedievalArchery3D.exe

      - name: Upload Windows Standalone Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-standalone-exe
          path: builds/windows/
          retention-days: 14

  build-macos:
    name: macOS App (.app.zip)
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Pre-heat project (.godot import cache)
        run: |
          mkdir -p builds/macos
          HOME=/root godot --headless --import --quit || true

      - name: Export macOS App Bundle
        run: HOME=/root godot --headless --verbose --export-release "macOS" builds/macos/MedievalArchery3D-macOS.zip

      - name: Upload macOS App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: builds/macos/
          retention-days: 14

  build-release-aab:
    name: Signed Release AAB (Free & Paid)
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || inputs.build_release == true
    container:
      image: barichello/godot-ci:4.3
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Decode Release Keystore from Secrets (or fallback keystore)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_USER: ${{ secrets.ANDROID_RELEASE_KEYSTORE_USER }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
        run: |
          mkdir -p builds
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_USER" ] && [ -n "$KEYSTORE_PASS" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > /tmp/release.keystore
            REL_USER="$KEYSTORE_USER"
            REL_PASS="$KEYSTORE_PASS"
          else
            echo "::warning::ANDROID_RELEASE_KEYSTORE_* secrets not set; generating temporary signing key for AAB."
            keytool -keyalg RSA -genkeypair -alias archery_release -keypass android               -keystore /tmp/release.keystore -storepass android               -dname "CN=Medieval Archery,O=Dev,C=US" -validity 9999 -deststoretype pkcs12
            REL_USER="archery_release"
            REL_PASS="android"
          fi
          sed -i "s|keystore/release=\"\"|keystore/release=\"/tmp/release.keystore\"|g" export_presets.cfg
          sed -i "s|keystore/release_user=\"\"|keystore/release_user=\"${REL_USER}\"|g" export_presets.cfg
          sed -i "s|keystore/release_password=\"\"|keystore/release_password=\"${REL_PASS}\"|g" export_presets.cfg

      - name: Pre-heat project (.godot import cache)
        run: |
          mkdir -p android/build
          unzip -q -o /root/.local/share/godot/export_templates/4.3.stable/android_source.zip -d android/build
          HOME=/root godot --headless --import --quit || true

      - name: Export Android Free Release AAB
        run: HOME=/root godot --headless --verbose --export-release "Android Free Release" builds/medieval_archery_free_release.aab

      - name: Export Android Paid Release AAB
        run: HOME=/root godot --headless --verbose --export-release "Android Paid Release" builds/medieval_archery_paid_release.aab

      - name: Clean up temporary keystore
        if: always()
        run: rm -f /tmp/release.keystore

      - name: Upload Release AABs
        uses: actions/upload-artifact@v4
        with:
          name: android-release-aabs
          path: |
            builds/medieval_archery_free_release.aab
            builds/medieval_archery_paid_release.aab
          retention-days: 30

  publish-release:
    name: Create GitHub Release (EXE + macOS .app + AAB + APK)
    needs: [build-windows, build-macos, build-debug-apk, build-release-aab]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Flatten release assets
        run: |
          mkdir -p final-release
          find release-assets -type f -exec cp {} final-release/ \;
          ls -lh final-release/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: final-release/*
